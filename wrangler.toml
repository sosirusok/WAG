# Cloudflare Pages 배포 설정
#
# 대시보드에서 프로젝트를 만들 때 이름을 반드시 아래 name 과 같게(swagstudio) 지정해야 한다.
# 이름이 다르면 빌드가 실패한다. 공개 주소는 https://swagstudio.pages.dev/ 가 된다.
#
# 빌드 산출물 경로는 이 파일이 정하므로 대시보드의 "Build output directory" 는
# 비워 두거나 dist 로 두면 된다. 대시보드에서 직접 넣어야 하는 값은
# 빌드 명령(npm run build) 하나뿐이다.
#
# 공개 주소는 scripts/build.mjs 가 Cloudflare 가 자동으로 주는
# CF_PAGES_BRANCH / CF_PAGES_URL 로 알아내므로 SITE_URL 을 따로 넣을 필요가 없다.

name = "swagstudio"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-28"
