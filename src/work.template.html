<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/case-catharsis.jpg" as="image" type="image/jpeg" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="work">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-intro compact-intro">
      <div class="page-intro-backdrop" aria-hidden="true"><i class="hero-blob hero-blob-2"></i><i class="hero-grid"></i></div>
      <div class="intro-copy shell" data-reveal>
        <p class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span>PROJECTS</p>
        <h1 data-split>프로젝트</h1>
        <p class="section-lead">공개 중인 실제 운영 사이트와 담당 범위입니다.</p>
      </div>
    </header>
    <section class="work-editorial shell">{{WORK_CASES}}</section>
    {{CONTACT_STRIP}}
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
