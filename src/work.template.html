<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/IBMPlexSansKR-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/IBMPlexSansKR-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="work">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="cursor-orb" aria-hidden="true"></div>
  {{HEADER}}
  <main id="main">
    <header class="work-hero" aria-labelledby="work-title">
      <figure aria-hidden="true"><img src="assets/system-field.webp" alt="" fetchpriority="high" decoding="async"><i></i></figure>
      <div class="work-hero-inner shell">
        <p class="route-label reveal">WORK</p>
        <h1 id="work-title" class="reveal">공개한 작업</h1>
        <p class="reveal">현재 운영 중인 사이트의 실제 화면과 구현 내용을 모았습니다.</p>
      </div>
    </header>

    <section class="work-list shell" aria-label="공개 작업 목록">
      {{WORK_CARDS}}
    </section>

    <section class="route-cta shell reveal" aria-labelledby="work-contact-title">
      <p>다음 프로젝트</p>
      <div><h2 id="work-contact-title">새 작업에 대해 들려주세요.</h2><p>현재 주소와 바꾸고 싶은 점을 보내주셔도 됩니다.</p></div>
      <a class="button button-dark magnetic" href="contact/">문의 내용 정리 <i aria-hidden="true">→</i></a>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
