<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/swag-symbol-v4.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="work">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-hero page-hero-work" data-flash>
      <img class="page-hero-material" src="assets/texture-ink-drag-v1.webp" alt="" width="1800" height="594" data-parallax aria-hidden="true">
      <img class="page-signal" src="assets/accent-signal-drag-v1.webp" alt="" width="1800" height="600" aria-hidden="true">
      <div class="shell">
        <p class="eyebrow" data-reveal>SELECTED WORK</p>
        <h1 data-reveal data-impact-title data-echo="프로젝트">프로젝트</h1>
        <p class="page-lead" data-reveal>말보다 결과물. 공개된 사이트를 직접 눌러보세요.</p>
      </div>
    </header>

    <section class="work-feed shell" aria-label="프로젝트 목록">
      {{WORK_CARDS}}
    </section>

    <section class="project-invite shell" data-reveal data-shutter>
      <img src="assets/texture-shutter-v1.webp" alt="" width="1800" height="600" loading="lazy" aria-hidden="true">
      <p>NEXT PROJECT</p>
      <h2 data-impact-title data-echo="다음 공개작은 무엇인가요?">다음 공개작은 무엇인가요?</h2>
      <a class="button button-accent" href="contact/">프로젝트 문의 <i aria-hidden="true">↗</i></a>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
