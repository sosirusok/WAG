<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/SUIT-core.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="services">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-intro">
      <div class="spine"><b class="mono">S</b><h2>제작 분야</h2></div>
      <div class="intro-copy shell">
        <h1 class="page-title">제작 분야</h1>
        <p class="page-lead">기획 · 디자인 · 개발 · 배포까지, 분야별로 맡는 범위입니다.</p>
      </div>
    </header>

    <section class="service-editorial shell">{{SERVICE_CHAPTERS}}</section>

    <section class="capability-flow" aria-labelledby="capability-title" data-motion-scope data-reveal>
      <div class="sub-head shell"><p class="mono sub-label">FUNCTIONS</p><h2 id="capability-title">연동 기능</h2></div>
      <div class="capability-marquee"><div>{{CAPABILITY_FLOW}}{{CAPABILITY_FLOW}}</div></div>
      <p class="shell capability-note">결제 · 지도 · 알림 · 앱스토어는 필요한 계정과 심사 일정을 먼저 확인합니다.</p>
    </section>

    {{CONTACT_STRIP}}
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
