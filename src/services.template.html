<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/swag-symbol-v4.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="services">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-hero page-hero-services" data-flash>
      <img class="page-hero-material toner" src="assets/texture-toner-field-v1.webp" alt="" width="1400" height="933" data-parallax aria-hidden="true">
      <div class="shell">
        <p class="eyebrow" data-reveal>WHAT WE BUILD</p>
        <h1 data-reveal>제작 분야</h1>
        <p class="page-lead" data-reveal>보여주는 사이트부터 매일 쓰는 서비스까지, 필요한 구조에 맞춰 만듭니다.</p>
      </div>
    </header>

    <nav class="service-ribbon" aria-label="제작 분야 바로가기" data-marquee>
      <div><a href="services/#web">웹사이트</a><i></i><a href="services/#app">모바일 앱</a><i></i><a href="services/#game">브라우저 게임</a><i></i><a href="services/#platform">운영 시스템</a><i></i><a aria-hidden="true" tabindex="-1" href="services/#web">웹사이트</a><i aria-hidden="true"></i><a aria-hidden="true" tabindex="-1" href="services/#app">모바일 앱</a><i aria-hidden="true"></i><a aria-hidden="true" tabindex="-1" href="services/#game">브라우저 게임</a><i aria-hidden="true"></i><a aria-hidden="true" tabindex="-1" href="services/#platform">운영 시스템</a><i aria-hidden="true"></i></div>
    </nav>

    <section class="service-detail shell">{{SERVICE_CHAPTERS}}</section>

    <section class="capability-field" data-flash>
      <img src="assets/accent-exposure-v1.webp" alt="" width="1600" height="800" loading="lazy" aria-hidden="true">
      <div class="shell">
        <header data-reveal><p>CONNECTED FEATURES</p><h2>필요한 기능을 한 흐름으로</h2></header>
        <div>{{CAPABILITY_GRID}}</div>
      </div>
    </section>

    <section class="simple-cta shell" data-reveal>
      <p>원하는 형태가 목록에 없어도 괜찮습니다.</p>
      <a class="button button-dark" href="contact/">가능 여부 확인하기 <i aria-hidden="true">↗</i></a>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
