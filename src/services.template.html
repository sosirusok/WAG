<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f8">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/WantedSansVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="services">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-intro shell reveal"><p>Services</p><div><h1>웹, 앱, 게임 그리고<br>운영 시스템.</h1><span>웹사이트와 앱, 웹게임을 만들고 로그인, 예약, 결제, 데이터와 관리자 기능을 연결합니다.</span></div></header>

    <section class="service-chapters shell" aria-label="서비스별 제작 범위">{{SERVICE_CHAPTERS}}</section>

    <section class="scope-board reveal" aria-labelledby="capability-title">
      <div class="shell">
        <div class="scope-board-head"><p>Connected features</p><div><h2 id="capability-title">운영에 필요한<br>기능을 연결합니다.</h2><span>회원, 결제, 데이터와 자동화 기능은 실제 운영 방식에 맞춰 구성합니다.</span></div></div>
        <div class="scope-board-grid">{{CAPABILITY_GRID}}</div>
      </div>
    </section>

    <section class="compact-contact shell reveal"><p>프로젝트 문의</p><a href="contact/"><span>필요한 기능 선택하기</span><i aria-hidden="true">↗</i></a></section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
