<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/IBMPlexSansKR-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="project">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="cursor-orb" aria-hidden="true"></div>
  {{HEADER}}
  <main id="main">
    <article class="project-page">
      <header class="project-hero shell">
        <a class="breadcrumb reveal" href="work/">작업으로 돌아가기 <i aria-hidden="true">↖</i></a>
        <div class="project-heading">
          <p class="reveal"><span>{{PROJECT_CATEGORY}}</span><b>{{PROJECT_YEAR}}</b></p>
          <h1 class="reveal">{{PROJECT_TITLE}}</h1>
          <div class="reveal"><p>{{PROJECT_SUMMARY}}</p>{{PROJECT_EXTERNAL}}</div>
        </div>
      </header>

      <figure class="project-cover shell reveal" data-project-visual>
        <span class="project-cover-media" data-tilt>{{PROJECT_IMAGE}}</span>
        <i class="project-cover-scan" aria-hidden="true"></i>
      </figure>

      <section class="project-story shell" aria-label="프로젝트 설명">
        <article class="reveal"><h2>문제</h2><p>{{PROJECT_PROBLEM}}</p></article>
        <article class="reveal"><h2>구성</h2><p>{{PROJECT_SOLUTION}}</p></article>
        <article class="reveal"><h2>결과</h2><p>{{PROJECT_RESULT}}</p></article>
      </section>

      <section class="project-features shell reveal" aria-labelledby="project-features-title">
        <h2 id="project-features-title">주요 기능</h2>
        <ul>{{PROJECT_FEATURES}}</ul>
      </section>

      <div class="project-next shell reveal">{{NEXT_PROJECT}}</div>
    </article>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
