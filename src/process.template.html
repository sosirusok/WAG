<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="process">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="cursor-orb" aria-hidden="true"></div>
  {{HEADER}}
  <main id="main">
    <header class="process-hero" aria-labelledby="process-title" data-auto-motion>
      <div class="kinetic-assembly kinetic-assembly-route kinetic-route-process" aria-hidden="true">
        <img class="kinetic-piece kinetic-red-rip" src="assets/accent-red-rip.webp" alt="" fetchpriority="high" decoding="async">
        <img class="kinetic-piece kinetic-black-burst" src="assets/accent-black-burst.webp" alt="" decoding="async">
        <img class="kinetic-piece kinetic-red-stamp" src="assets/accent-red-stamp.webp" alt="" decoding="async">
      </div>
      <div class="process-hero-inner shell">
        <p class="route-label reveal">PROCESS</p>
        <h1 id="process-title" class="reveal">처음 이야기부터 공개까지</h1>
        <p class="reveal">핵심 화면을 먼저 확인한 뒤 개발 항목과 공개 일정을 확정합니다.</p>
      </div>
    </header>

    <section class="process-story shell" aria-label="제작 진행 방식" data-process-story>
      <aside class="process-side" aria-hidden="true">
        <span>진행 중</span>
        <strong data-process-label>이야기 정리</strong>
        <i><b data-process-bar></b></i>
      </aside>
      <div class="process-scenes">{{PROCESS}}</div>
    </section>

    <section class="process-finish" aria-labelledby="process-finish-title" data-auto-motion>
      <div class="kinetic-assembly kinetic-assembly-wide" aria-hidden="true">
        <img class="kinetic-piece kinetic-white-tape" src="assets/accent-white-tape.webp" alt="" loading="lazy" decoding="async">
        <img class="kinetic-piece kinetic-black-burst" src="assets/accent-black-burst.webp" alt="" loading="lazy" decoding="async">
      </div>
      <div class="process-finish-inner shell">
        <p class="reveal">LIVE</p>
        <h2 id="process-finish-title" class="reveal">마지막은 시안이 아니라 실제 주소입니다.</h2>
        <p class="reveal">주요 기능을 검수한 뒤 운영 주소에 배포합니다. 유지보수 항목과 기간은 공개 전에 정합니다.</p>
      </div>
    </section>

    <section class="route-cta shell reveal" aria-labelledby="process-contact-title">
      <p>시작하기</p>
      <div><h2 id="process-contact-title">메모만 있어도 시작할 수 있습니다.</h2><p>현재 알고 있는 내용과 참고 사이트를 보내주세요.</p></div>
      <a class="button button-dark magnetic" href="contact/">상담 준비하기 <i aria-hidden="true">→</i></a>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
