<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/SUIT-core.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="process">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <header class="page-intro process-intro">
      <div class="page-intro-backdrop" aria-hidden="true"><i class="hero-grid"></i></div>
      <div class="intro-copy shell" data-reveal>
        <p class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span>PROCESS</p>
        <h1 data-split>진행 방식</h1>
        <p class="section-lead">상담 · 기획 · 디자인 · 개발 · 검수 · 배포, 단계마다 확인할 결과가 있습니다.</p>
      </div>
    </header>

    <section class="process-editorial shell" aria-label="프로젝트 진행 과정">
      <div class="process-line" aria-hidden="true"><i></i></div>
      {{PROCESS}}
    </section>

    <section class="after-launch shell" data-reveal>
      <div><p class="eyebrow">AFTER LAUNCH</p><h2 data-split>배포 이후 지원</h2></div>
      <div class="after-launch-cards">
        <p><b>인계</b>운영 주소 · 관리자 화면 · 계정 · 콘텐츠 수정 방법</p>
        <p><b>유지</b>오류 수정 · 화면 보완 · 기능 추가</p>
      </div>
    </section>

    {{CONTACT_STRIP}}
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
