<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8F6">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/swag-mark-v42.png" type="image/png">
  <link rel="preload" href="assets/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/studio-hero-v42.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="process">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <section class="photo-intro process-intro">
      <figure data-parallax><img src="assets/studio-hero-v42.webp" alt="두 명의 제작자가 화면을 함께 검토하는 밝은 작업실" width="1672" height="941" fetchpriority="high" decoding="async"><span class="image-scan" aria-hidden="true"></span></figure>
      <div class="photo-intro-copy shell" data-reveal>
        <p class="eyebrow">PROCESS</p>
        <h1>진행 방식</h1>
        <p>상담 · 기획 · 디자인 · 개발 · 검수 · 배포</p>
      </div>
    </section>

    <section class="process-editorial shell" aria-label="프로젝트 진행 과정">
      <div class="process-line" aria-hidden="true"><i></i></div>
      {{PROCESS}}
    </section>

    <section class="after-launch shell" data-reveal>
      <div><p class="eyebrow">AFTER LAUNCH</p><h2>배포 이후 지원</h2></div>
      <div><p>운영 주소 · 관리자 화면 · 계정 · 콘텐츠 수정 방법</p><p>오류 수정 · 화면 보완 · 기능 추가</p></div>
    </section>

    {{CONTACT_STRIP}}
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
