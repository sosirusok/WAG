<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/IBMPlexSansKR-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="process">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  <div class="page-wipe" aria-hidden="true"></div>
  <div class="cursor-orb" aria-hidden="true"></div>
  {{HEADER}}
  <main id="main">
    <header class="process-hero" aria-labelledby="process-title">
      <figure aria-hidden="true"><img src="assets/system-field.webp" alt="" fetchpriority="high" decoding="async"><i></i></figure>
      <canvas class="process-canvas" data-process-canvas aria-hidden="true"></canvas>
      <div class="process-hero-inner shell">
        <p class="route-label reveal">PROCESS</p>
        <h1 id="process-title" class="reveal">처음 이야기부터 공개까지</h1>
        <p class="reveal">중간 결과를 실제 화면으로 확인하면서 다음 작업을 이어갑니다.</p>
      </div>
    </header>

    <section class="process-story shell" aria-label="제작 진행 방식" data-process-story>
      <aside class="process-side" aria-hidden="true">
        <span>진행 중</span>
        <strong data-process-label>이야기 정리</strong>
        <i><b data-process-bar></b></i>
      </aside>
      <div class="process-scenes">{{PROCESS}}</div>
    </section>

    <section class="process-finish" aria-labelledby="process-finish-title">
      <div class="process-finish-art" aria-hidden="true"><img src="assets/game-impact.webp" alt="" loading="lazy" decoding="async"><i></i></div>
      <div class="process-finish-inner shell">
        <p class="reveal">LIVE</p>
        <h2 id="process-finish-title" class="reveal">마지막은 시안이 아니라 실제 주소입니다.</h2>
        <p class="reveal">누르고 입력하며 문제를 고친 뒤 공개합니다. 그다음 수정이나 기능 추가도 이어서 맡을 수 있습니다.</p>
      </div>
    </section>

    <section class="route-cta shell reveal" aria-labelledby="process-contact-title">
      <p>시작하기</p>
      <div><h2 id="process-contact-title">처음부터 완벽하게 정리할 필요는 없습니다.</h2><p>{{RESPONSE_NOTE}}</p></div>
      <a class="button button-dark magnetic" href="contact/">프로젝트 문의 <i aria-hidden="true">→</i></a>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
