<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f9fc">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/WantedSansVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="home">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <section class="editorial-hero" aria-labelledby="home-title">
      <picture class="editorial-hero-backdrop" data-ambient aria-hidden="true"><img src="assets/cover-horizon.svg" alt="" fetchpriority="high" decoding="async"></picture>
      <i class="editorial-hero-sweep" aria-hidden="true"></i>
      <div class="editorial-hero-inner shell">
        <div class="editorial-hero-copy reveal">
          <span class="editorial-hero-kicker">System / Web / App / Game</span>
          <h1 id="home-title">SWAG</h1>
          <p>{{HERO_DESCRIPTION}}</p>
          <div class="editorial-hero-links">
            <a href="services/"><span>제작 범위</span><i aria-hidden="true">↗</i></a>
            <a href="contact/"><span>프로젝트 문의</span><i aria-hidden="true">↗</i></a>
          </div>
        </div>
        <div class="editorial-hero-signature" aria-hidden="true">
          <span>System Web App Game</span>
          <i></i>
        </div>
        <nav class="editorial-hero-services reveal" aria-label="제작 분야 바로가기">
          <a href="services/#web"><small>01</small><span>웹사이트</span></a>
          <a href="services/#app"><small>02</small><span>앱 · 웹앱</span></a>
          <a href="services/#game"><small>03</small><span>웹게임</span></a>
          <a href="services/#system"><small>04</small><span>운영 시스템</span></a>
        </nav>
      </div>
    </section>

    <section class="home-scope-preview shell reveal" aria-labelledby="scope-preview-title">
      <div class="home-section-head"><div><h2 id="scope-preview-title">제작 범위</h2><p>필요한 부분만 골라 프로젝트에 맞게 구성합니다</p></div><a href="services/">자세히 보기 <i aria-hidden="true">↗</i></a></div>
      <div class="scope-preview-list">{{HOME_SERVICE_CARDS}}</div>
    </section>

    <section class="visual-contact reveal" aria-labelledby="home-contact-title">
      <figure class="contact-backdrop" data-ambient>{{HOME_CONTACT_IMAGE}}</figure>
      <div class="shell visual-contact-inner">
        <div class="contact-panel glass-panel">
          <h2 id="home-contact-title">프로젝트 상담</h2>
          <p>{{RESPONSE_NOTE}}</p>
          <div><a class="button" href="{{KAKAO_URL}}" target="_blank" rel="noopener noreferrer">카카오로 문의하기 <i aria-hidden="true">↗</i></a><a class="phone-link" href="tel:{{PHONE_DIGITS}}">{{PHONE}}</a></div>
        </div>
      </div>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
