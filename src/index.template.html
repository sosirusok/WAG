<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f9fc">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/MonaSansVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="home">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <section class="atelier-hero" aria-labelledby="home-title">
      <i class="atelier-grain" aria-hidden="true"></i>
      <div class="atelier-hero-inner shell">
        <div class="atelier-copy reveal">
          <span class="atelier-kicker"><i aria-hidden="true"></i>2인 프리랜서 제작팀</span>
          <h1 id="home-title">기획부터 배포까지<br><em>두 사람이 직접 만듭니다</em></h1>
          <p>{{HERO_DESCRIPTION}}</p>
          <div class="atelier-links">
            <a href="about/"><span>스튜디오 소개</span><i aria-hidden="true">↗</i></a>
            <a href="contact/"><span>프로젝트 문의</span><i aria-hidden="true">↗</i></a>
          </div>
        </div>

        <div class="atelier-stage" aria-label="서로 다른 재료가 하나의 구조로 연결된 SWAG의 제작 방식을 표현한 조형물">
          <i class="atelier-halo" data-ambient data-ambient-depth="0.22" aria-hidden="true"></i>
          <figure class="atelier-object atelier-object-main" data-ambient data-ambient-depth="0.55">
            <img src="assets/hero-atelier-v2.webp" alt="푸른 금속 리본과 반투명 막이 연결된 조형물" fetchpriority="high" decoding="async">
          </figure>
          <img class="atelier-object atelier-ribbon" src="assets/hero-ribbon-v2.webp" alt="" data-ambient data-ambient-depth="0.86" aria-hidden="true" fetchpriority="high" decoding="async">
          <img class="atelier-object atelier-materials" src="assets/hero-materials-v2.webp" alt="" data-ambient data-ambient-depth="1.16" aria-hidden="true" decoding="async">
          <i class="atelier-light" aria-hidden="true"></i>
          <div class="atelier-coordinates" aria-hidden="true">
            <span class="coordinate-web">WEB</span>
            <span class="coordinate-app">APP</span>
            <span class="coordinate-game">GAME</span>
            <span class="coordinate-system">SYSTEM</span>
            <svg viewBox="0 0 760 520" preserveAspectRatio="none"><path d="M36 126 C188 74 302 178 398 142 S574 54 724 108"/><path d="M92 408 C230 332 290 414 446 348 S616 270 708 326"/><circle cx="398" cy="142" r="4"/><circle cx="446" cy="348" r="4"/></svg>
          </div>
        </div>

        <div class="atelier-index reveal" aria-label="SWAG 제작 분야">
          <span>System</span><i></i><span>Web</span><i></i><span>App</span><i></i><span>Game</span>
        </div>
      </div>
    </section>

    <section class="home-scope-preview shell reveal" aria-labelledby="scope-preview-title">
      <div class="home-section-head"><div><h2 id="scope-preview-title">제작 범위</h2><p>필요한 부분만 골라 프로젝트에 맞게 구성합니다</p></div><a href="services/">자세히 보기 <i aria-hidden="true">↗</i></a></div>
      <div class="scope-preview-list">{{HOME_SERVICE_CARDS}}</div>
    </section>

    <section class="visual-contact reveal" aria-labelledby="home-contact-title">
      <figure class="contact-backdrop" data-ambient>{{HOME_CONTACT_IMAGE}}</figure>
      <div class="shell visual-contact-inner">
        <div class="contact-panel glass-panel">
          <h2 id="home-contact-title">프로젝트 상담</h2>
          <p>{{RESPONSE_NOTE}}</p>
          <div><a class="button" href="{{KAKAO_URL}}" target="_blank" rel="noopener noreferrer">카카오로 문의하기 <i aria-hidden="true">↗</i></a><a class="phone-link" href="tel:{{PHONE_DIGITS}}">{{PHONE}}</a></div>
        </div>
      </div>
    </section>
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
