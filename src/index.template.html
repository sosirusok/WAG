<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8F6">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <base href="{{SITE_URL}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="icon" href="assets/swag-mark-v42.png" type="image/png">
  <link rel="preload" href="assets/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/studio-hero-v42.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="assets/swag-signature-v42.png" as="image" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>{{PAGE_TITLE}}</title>
  <script>document.documentElement.classList.add("js")</script>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body id="top" data-page="home">
  <a class="skip-link" href="{{CANONICAL_URL}}#main">본문으로 바로가기</a>
  {{HEADER}}
  <main id="main">
    <section class="cinematic-hero" data-impact-hero>
      <figure class="hero-photo" data-hero-photo>
        <img src="assets/studio-hero-v42.webp" alt="밝은 스튜디오에서 두 명의 제작자가 모니터와 휴대전화로 웹사이트를 확인하는 장면" width="1672" height="941" fetchpriority="high" decoding="async">
      </figure>
      <canvas class="film-canvas" data-film-canvas aria-hidden="true"></canvas>
      <div class="film-grain" aria-hidden="true"></div>
      <div class="film-splice" aria-hidden="true"></div>
      <div class="hero-facts shell">
        <p class="hero-label" data-reveal>{{HERO_DESCRIPTION}}</p>
        <h1 data-reveal>{{HERO_HEADLINE}}</h1>
        <div class="hero-direct" data-reveal>
          <p>상담 · 기획 · 디자인 · 개발 · 검수 · 배포</p>
          <div><a class="text-link magnetic" href="services/">{{HERO_SECONDARY_CTA}} <span aria-hidden="true">↗</span></a><a class="text-link magnetic" href="contact/">{{HERO_PRIMARY_CTA}} <span aria-hidden="true">↗</span></a></div>
        </div>
      </div>
      <a class="scroll-cue" href="./#scope"><span>SCROLL</span><i aria-hidden="true"></i></a>
    </section>

    <section class="home-scope" id="scope" aria-labelledby="scope-title">
      <header class="shell" data-reveal>
        <p class="eyebrow">{{BRAND_EXPANSION}}</p>
        <h2 id="scope-title">제작 분야</h2>
        <a class="text-link magnetic" href="services/">전체 보기 <span aria-hidden="true">↗</span></a>
      </header>
      <div class="film-window" data-drag-film>{{HOME_FILM}}</div>
    </section>

    <section class="home-studio" aria-labelledby="studio-title">
      <figure data-parallax data-reveal>
        <img src="assets/studio-about-v42.webp" alt="유리문 너머 밝은 작업실에서 두 명이 앱 화면을 함께 확인하는 장면" width="1536" height="1024" loading="lazy" decoding="async">
        <span class="image-scan" aria-hidden="true"></span>
      </figure>
      <div class="studio-note shell" data-reveal>
        <p class="eyebrow">ABOUT</p>
        <h2 id="studio-title">2인 프리랜서</h2>
        <p>상담한 두 사람이 기획부터 배포까지 담당</p>
        <a class="text-link magnetic" href="about/">소개 보기 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    {{CONTACT_STRIP}}
  </main>
  {{FOOTER}}
  <script src="app.js" defer></script>
</body>
</html>
