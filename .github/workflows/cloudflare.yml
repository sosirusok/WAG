name: Deploy SWAG to Cloudflare Pages

# 공개 주소: https://swagstudio.pages.dev/
#
# 이 저장소의 Pages 프로젝트는 Direct Upload 방식이라 Cloudflare 가 스스로
# 저장소를 빌드하지 않는다(대시보드에서 신규 Pages 생성이 막혀 API 로 만들었고,
# Direct Upload 프로젝트는 나중에 Git 연결로 바꿀 수 없다).
# 그래서 빌드와 업로드를 여기서 한다.
#
# 필요한 저장소 Secret 두 개
#   CLOUDFLARE_API_TOKEN   Cloudflare Pages 편집 권한 토큰
#   CLOUDFLARE_ACCOUNT_ID  50e681eeae8d24131bff5cea7cf2fb89
# 설정 위치: Settings > Secrets and variables > Actions > New repository secret
#
# Secret 이 없으면 실패시키지 않고 건너뛴다. 설정 전에도 다른 워크플로가
# 빨간불로 보이지 않게 하려는 것이다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when Cloudflare secrets are not configured
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 미설정 - 배포를 건너뜁니다."

      - name: Setup Node
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npm run check

      - name: Build static site
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npm run build
        env:
          SITE_URL: https://swagstudio.pages.dev/

      - name: Verify generated routes and assets
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: node scripts/audit-links.mjs

      - name: Upload to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name=swagstudio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
