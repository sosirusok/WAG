# 옛 주소 전용 워크플로.
#
# 실제 사이트는 Cloudflare Pages(https://swagstudio.pages.dev/)가 서비스한다.
# GitHub Pages 에는 사이트를 더 이상 올리지 않고, 예전에 공유된 링크가
# 새 주소의 같은 자리로 도착하도록 리디렉션 페이지만 올린다.
# 사이트 배포는 .github/workflows/cloudflare.yml 이 담당한다.
name: Redirect old GitHub Pages address to swagstudio.pages.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build redirect pages
        run: node scripts/build-redirect.mjs
        env:
          REDIRECT_TARGET: https://swagstudio.pages.dev/
          REDIRECT_OLD_BASE: /WAG/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
